name: Lucia label fix
on:
  push:
    paths:
      - 'triggers/lucia-label-fix.txt'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i 's/adrianstenerife@gmail.com/Luciaamaralcorrea@gmail.com/g' index.html
          sed -i 's/Juan Pérez/Lucía/g' index.html
          sed -i "s/name:'Juan Pérez'/name:'Lucía'/g" index.html
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Actualiza empleado piloto a Lucía' || true
          git push
