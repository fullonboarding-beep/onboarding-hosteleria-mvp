name: Sync progress Supabase v2
on:
  push:
    paths:
      - 'scripts/sync_progress_supabase.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/sync_progress_supabase.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          js=re.findall(r'<script>(.*?)</script>',s,re.S)[-1]
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/app.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Sincroniza progreso por empleado con Supabase' || exit 0
          git push
