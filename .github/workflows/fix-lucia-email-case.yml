name: Fix Lucia email case
on:
  push:
    paths:
      - '.github/workflows/fix-lucia-email-case.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix employee credential case
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const credentials={employee:{user:'Luciaamaralcorrea@gmail.com'},manager:{user:'1982mag.lil.aar@gmail.com'}};"
          new="const credentials={employee:{user:'luciaamaralcorrea@gmail.com'},manager:{user:'1982mag.lil.aar@gmail.com'}};"
          if old not in s:
              raise SystemExit('expected credential not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          js=re.findall(r'<script>(.*?)</script>',s,re.S)[-1]
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Corrige autorización de Lucía' || exit 0
          git push
