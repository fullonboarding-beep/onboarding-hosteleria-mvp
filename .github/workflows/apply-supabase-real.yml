name: Apply Supabase real pilot integration
on:
  push:
    paths:
      - 'scripts/apply_supabase_real_patch.py'
      - '.github/workflows/apply-supabase-real.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded patch
        run: python scripts/apply_supabase_real_patch.py
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,flags=re.S)
          inline='\n'.join(x for x in scripts if x.strip())
          Path('/tmp/app.js').write_text(inline)
          PY
          node --check /tmp/app.js
      - name: Commit application
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Connecta el piloto real con Supabase'
          git push origin HEAD:main
